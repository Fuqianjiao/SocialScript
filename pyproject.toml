[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "douyin-mcp-server"
version = "1.4.1"
description = "Local social media video and spoken-script extractor for Douyin and Xiaohongshu"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "yzfly", email = "yz.liu.me@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests",
    "ffmpeg-python",
    "tqdm",
    "dashscope",
    "f2>=0.0.1.7",
]

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn",
    "jinja2",
]

[project.urls]
Homepage = "https://github.com/Fuqianjiao/SocialScript"
Repository = "https://github.com/Fuqianjiao/SocialScript"
Issues = "https://github.com/Fuqianjiao/SocialScript/issues"

[project.scripts]
douyin-mcp-server = "douyin_mcp_server.server:main"
